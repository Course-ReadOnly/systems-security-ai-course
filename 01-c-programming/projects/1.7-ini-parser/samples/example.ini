; Sample INI for the 1.7 parser. Exercises: an implicit global section
; (these two keys, before any [section] header), both comment styles
; (';' and '#'), whitespace variance around '=', and a duplicate
; [server] section header further down (decide merge vs. last-wins).

implicit_key = value_before_any_section
another_global=true

[server]
host = localhost
port = 8080

# port is deliberately re-specified in a second [server] block below
[client]
retries = 3
timeout=15

[server]
port = 9090
tls = true

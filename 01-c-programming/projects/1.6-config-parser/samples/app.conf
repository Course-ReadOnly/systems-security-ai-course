# Sample config for the 1.6 config parser.
# Comment lines like this one, and blank lines, should be skipped.

name = MyApp
version=1.0.3
debug = true

# whitespace around '=' varies on purpose above and below
max_connections=100
log_path = /var/log/myapp.log
retry_count = 3

# a key intentionally NOT looked up in any demo, so you have
# something to test "key exists but untouched" against too
feature_flag_beta = false
